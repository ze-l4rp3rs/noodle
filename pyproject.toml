[project]
name = "noodle"
version = "0.1.0"
description = "Noodle: company-brain backend over a single FalkorDB graph"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
extract = [
    "xberg>=1.3",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
anthropic = ["anthropic>=0.40"]
google = ["google-generativeai>=0.8"]
openai = ["openai>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a live FalkorDB (Docker) loaded with the synthetic dataset",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "I"]
